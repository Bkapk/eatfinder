# hajdehajme.bleart.dev -> PM2 eatfinder-dev on 127.0.0.1:3009
#
# Virtualmin generates its own vhost for this sub-server. Paste these location
# blocks into the generated SSL server block rather than replacing the file, so
# Virtualmin's Let's Encrypt renewal wiring keeps working.

# Community photo uploads. The app caps at 5 MB; nginx defaults to 1 MB and
# would reject them with a 413 before the route ever validated the file.
client_max_body_size 8M;

# Staging is publicly reachable by choice, but must never be indexed —
# duplicate content against the eventual production domain, and half-finished
# restaurant data.
add_header X-Robots-Tag "noindex, nofollow" always;

# GitHub push -> deploy. This normally lives on the production vhost, but there
# is no production domain yet, so it lives here. auth_basic is off explicitly so
# it keeps working if basic auth is ever switched on for the rest of the site —
# GitHub authenticates with the HMAC signature instead and cannot satisfy a
# password prompt.
location = /webhook {
    proxy_pass http://127.0.0.1:9884;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    auth_basic off;
}

# Uploaded images served straight off disk, bypassing Node. Filenames are random
# and never reused, so they are safe to cache hard. Harmless once R2 is
# configured — nothing is written here then.
location /uploads/ {
    alias /home/bleart/eatfinder-data/dev/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /_next/static/ {
    proxy_pass http://127.0.0.1:3009;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3009;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    # X-Forwarded-For is what the app's rate limiters key on. Without it every
    # visitor shares one bucket and the first burst locks out everyone.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Places import downloads up to 6 photos per place and Gemini enrichment is
    # a foreground call; nginx's 60s default cuts both off mid-flight.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
