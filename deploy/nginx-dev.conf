# The live vhost for hajdehajme.bleart.dev, as actually deployed to
# /etc/nginx/sites-available/hajdehajme.bleart.dev.conf.
#
# Virtualmin generated this file originally, as a PHP/WordPress vhost. Two of
# its defaults were actively dangerous once the document root became a git
# checkout, and both fixes below are load-bearing rather than tidying:
#
#   1. `location / { try_files $uri $uri/ "/index.php?$args"; }` served ANY file
#      in the repo as a static download — .env, .git/config, the lot. Replaced
#      by the proxy_pass, plus an explicit dotfile deny in case a future
#      Virtualmin regeneration puts try_files back.
#   2. `location ~ "\.php(/|$)"` handed anything ending in .php to PHP-FPM. A
#      plain-prefix `location /uploads/` LOSES to a regex location, so an
#      uploaded file named x.php would have been executed. /uploads/ therefore
#      uses `^~`, which beats regex matching.
#
# WARNING: Virtualmin owns this file and may regenerate it if domain settings
# are changed in its UI, silently restoring both problems above. If the site
# starts 404ing or serving raw files, diff it against this copy first.

server {
	server_name hajdehajme.bleart.dev www.hajdehajme.bleart.dev mail.hajdehajme.bleart.dev webmail.hajdehajme.bleart.dev admin.hajdehajme.bleart.dev;

	# Bound to the specific public IP, not 0.0.0.0. A curl to 127.0.0.1 with a
	# Host header therefore does NOT reach this block — it lands on the default
	# vhost. Test with: curl --resolve hajdehajme.bleart.dev:443:65.21.174.133
	listen 65.21.174.133;
	listen [2a01:4f9:3071:2f9b::2];
	listen 65.21.174.133:443 ssl;
	listen [2a01:4f9:3071:2f9b::2]:443 ssl;
	ssl_certificate /etc/ssl/virtualmin/1731537357119128/ssl.cert;
	ssl_certificate_key /etc/ssl/virtualmin/1731537357119128/ssl.key;

	root /home/bleart/domains/hajdehajme.bleart.dev/public_html;
	access_log /var/log/virtualmin/hajdehajme.bleart.dev_access_log;
	error_log /var/log/virtualmin/hajdehajme.bleart.dev_error_log;

	# The app caps uploads at 5MB and validates by magic bytes; this only bounds
	# what nginx buffers before the route gets a chance to reject it.
	client_max_body_size 16M;

	# Staging must never be indexed: duplicate content against the eventual
	# production domain, and half-finished restaurant data.
	add_header X-Robots-Tag "noindex, nofollow" always;

	# Let's Encrypt renewal. ^~ so it beats every regex location below.
	location ^~ /.well-known/ {
		try_files $uri /;
	}

	location ~ /\. {
		deny all;
		return 404;
	}

	# GitHub push -> deploy listener. Exact match, so it always wins.
	# Lives here rather than on a production vhost because there is no
	# production domain yet.
	location = /webhook {
		proxy_pass http://127.0.0.1:9884;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 30s;
	}

	location ^~ /uploads/ {
		alias /home/bleart/eatfinder-data/dev/uploads/;
		expires 30d;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	location / {
		proxy_pass http://127.0.0.1:3009;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		# The app's rate limiters key on X-Forwarded-For. Without it every
		# visitor shares one bucket and the first burst locks out everyone.
		# Note this site sits behind Cloudflare, so the real client IP is the
		# leftmost entry, not $remote_addr.
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
		# Places import downloads up to 6 photos per place and Gemini
		# enrichment is a foreground call; nginx's 60s default cuts both off.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	if ($host = webmail.hajdehajme.bleart.dev) {
		rewrite "^/(.*)$" "https://hajdehajme.bleart.dev:20000/$1" redirect;
	}
	if ($host = admin.hajdehajme.bleart.dev) {
		rewrite "^/(.*)$" "https://hajdehajme.bleart.dev:10000/$1" redirect;
	}
}
