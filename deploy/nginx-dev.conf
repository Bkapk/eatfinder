# dev.<APP_DOMAIN> -> PM2 eatfinder-dev on 127.0.0.1:3006
#
# Virtualmin usually writes its own vhost for a sub-server. Rather than replacing
# that file, paste the location blocks below into the generated SSL vhost — you
# keep Virtualmin's Let's Encrypt renewal wiring that way.
#
# Replace dev.CHANGEME.com with your subdomain before installing.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.CHANGEME.com;

    # Virtualmin's Let's Encrypt paths. Confirm with: virtualmin list-domains --name dev.CHANGEME.com
    ssl_certificate     /home/CHANGEME/domains/dev.CHANGEME.com/ssl.combined;
    ssl_certificate_key /home/CHANGEME/domains/dev.CHANGEME.com/ssl.key;

    # Staging must not be publicly readable, and must not be indexed. Create the
    # password file with:  htpasswd -c /home/CHANGEME/.htpasswd-dev <username>
    auth_basic           "EatFinder staging";
    auth_basic_user_file /home/CHANGEME/.htpasswd-dev;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Community photo uploads. The app caps at 5 MB; nginx defaults to 1 MB and
    # would reject them with a 413 before the route ever validated the file.
    client_max_body_size 8M;

    # Uploaded images are served straight off disk, bypassing Node entirely.
    # Filenames are random and content-addressed, so they are safe to cache hard.
    # Harmless when R2 is configured — nothing is written here.
    location /uploads/ {
        alias /home/CHANGEME/eatfinder-data/dev/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # X-Forwarded-For is what the app's rate limiters key on. Without it every
        # visitor shares one bucket and the first burst locks out everyone.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Places import downloads up to 6 photos per place and Gemini enrichment
        # is a foreground call; the 60s default cuts both off mid-flight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.CHANGEME.com;
    return 301 https://$host$request_uri;
}
