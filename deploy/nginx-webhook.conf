# Paste this location block into the PRODUCTION vhost (the apex domain), not the
# dev one — the dev vhost has auth_basic, which GitHub cannot satisfy and which
# would make every delivery fail with 401.
#
# The listener binds 127.0.0.1:9876. This block is the only public route to it;
# never open 9876 in the firewall.

location = /webhook {
    proxy_pass http://127.0.0.1:9876;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The listener answers 202 immediately and builds in the background, so this
    # only needs to cover the HMAC check.
    proxy_read_timeout 30s;

    # auth_basic is inherited from an enclosing block if one sets it. GitHub
    # authenticates with the HMAC signature instead, so switch it off here.
    auth_basic off;
}
