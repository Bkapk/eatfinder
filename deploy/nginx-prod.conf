# <APP_DOMAIN> -> PM2 eatfinder on 127.0.0.1:3005
# Same shape as nginx-dev.conf, minus auth_basic and the noindex header, plus
# the /webhook block. Replace CHANGEME.com before installing.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CHANGEME.com www.CHANGEME.com;

    ssl_certificate     /home/CHANGEME/ssl.combined;
    ssl_certificate_key /home/CHANGEME/ssl.key;

    client_max_body_size 8M;

    # GitHub push -> deploy. Only the dev branch actually deploys; see
    # BRANCHES in deploy/webhook-listener.js. It lives on the prod vhost because
    # the dev vhost's auth_basic would 401 every delivery.
    location = /webhook {
        proxy_pass http://127.0.0.1:9876;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        auth_basic off;
    }

    location /uploads/ {
        alias /home/CHANGEME/eatfinder-data/prod/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # The app's rate limiters key on X-Forwarded-For. Without it every visitor
        # shares one bucket.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name CHANGEME.com www.CHANGEME.com;
    return 301 https://$host$request_uri;
}
